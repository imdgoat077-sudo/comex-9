<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src https: data:">
<style>
  /* Everything shown here comes from pages (titles, addresses), so it is set as text, never as markup. */
  :root { --bg: #1d2025; --fg: #ecedef; --fg2: #a2a7b0; --fg3: #6c717a; --line: #30343b; --hover: #262a30; --sel: #2f343b; --accent: #7c9cff; --run: #e5b44a; --ok: #4fb286; --err: #e5675c; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; color: var(--fg); -webkit-font-smoothing: antialiased; }
  .panel { position: absolute; inset: 0 10px 12px 10px; background: var(--bg); border-radius: 8px; box-shadow: 0 10px 28px rgba(0,0,0,.45), 0 0 0 1px var(--line); padding: 4px; box-sizing: border-box; overflow: hidden; }
  .panel.hidden { display: none; }
  .row { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 6px; cursor: default; }
  .row:hover { background: var(--hover); }
  .row.sel { background: var(--sel); }
  .icon { width: 16px; height: 16px; flex: none; color: var(--fg3); display: flex; align-items: center; justify-content: center; }
  .row.sel .icon { color: var(--fg2); }
  .title { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg3); font-size: 12px; }
  .sub::before { content: "— "; }
  .card { padding: 10px 12px; }
  .card-head { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--fg3); flex: none; }
  .working .dot { background: var(--run); }
  .completed .dot { background: var(--ok); }
  .failed .dot, .blocked .dot { background: var(--err); }
  .time { margin-left: auto; color: var(--fg3); font-weight: 400; font-variant-numeric: tabular-nums; }
  .line { margin-top: 6px; color: var(--fg2); font-size: 12px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .line.dim { color: var(--fg3); }
  @media (prefers-reduced-motion: no-preference) { .panel { animation: in .12s ease-out; } @keyframes in { from { opacity: 0; transform: translateY(-2px); } } }
</style>
</head>
<body>
<div class="panel hidden" id="panel" role="listbox"></div>
<script>
  const ICONS = {
    search: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
    url: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
    history: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    tab: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg>',
    bookmark: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>',
  };
  const panel = document.getElementById('panel');
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };

  function applyTheme(theme) {
    for (const [k, v] of Object.entries(theme || {})) {
      if (/^--[a-z0-9-]+$/.test(k) && typeof v === 'string' && v.length < 80) document.documentElement.style.setProperty(k, v);
    }
  }

  function render(p) {
    applyTheme(p.theme);
    panel.replaceChildren();
    panel.classList.toggle('hidden', !(p.items && p.items.length) && !p.card);
    if (p.kind === 'card' && p.card) {
      const c = el('div', `card ${String(p.card.status || '')}`);
      const head = el('div', 'card-head');
      head.append(el('span', 'dot'), el('span', '', String(p.card.title || '')));
      if (p.card.time) head.append(el('span', 'time', String(p.card.time)));
      c.append(head);
      for (const line of p.card.lines || []) c.append(el('div', `line${line.dim ? ' dim' : ''}`, String(line.text || '')));
      panel.append(c);
      return;
    }
    (p.items || []).forEach((item, i) => {
      const row = el('div', `row${i === p.selected ? ' sel' : ''}`);
      row.setAttribute('role', 'option');
      const icon = el('span', 'icon');
      icon.innerHTML = ICONS[item.type] || ICONS.url; // fixed markup from this page, never from the item
      row.append(icon, el('span', 'title', String(item.title || '')));
      if (item.subtitle) row.append(el('span', 'sub', String(item.subtitle)));
      // mousedown, not click: the address bar loses focus on click and would close the list first
      row.addEventListener('mousedown', (e) => { e.preventDefault(); window.comexPopup.pick(i); });
      panel.append(row);
    });
  }

  window.comexPopup.onRender(render);
</script>
</body>
</html>
